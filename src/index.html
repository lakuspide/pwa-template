<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>App Skeleton</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A mobile-first PWA template for any commercial sector: catalog, cart, checkout, roles and offline support."
    />

    <!-- Theme colour is kept in sync with the app theme by ThemeService. -->
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark light" />

    <!-- Installable web app (Android + iOS home screen) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skeleton" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
